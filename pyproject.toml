[project]
authors = [
  {name = "Saito Tsutomu", email = "tsutomu7@hotmail.co.jp"},
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python",
  "Topic :: Software Development",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pygame>=2.6.1",
]
description = "No Hint Crossword Puzzle"
include = ["crosswordpy_data"]
license = "Apache-2.0"
license-files = ["LICENSE*"]
name = "crosswordpy"
readme = "README.md"
requires-python = ">=3.11,<3.14"
version = "0.2.1"

[project.urls]
homepage = "https://github.com/SaitoTsutomu/crosswordpy"

[project.scripts]
crosswordpy = "crosswordpy:main"

[dependency-groups]
dev = []

[tool.taskipy.tasks]
lint = "ruff check src && pyrefly check src"

[tool.uv]
exclude-newer = "3 days"

[[tool.uv.index]]
default = true
url = "https://pypi.flatt.tech/simple/"

[tool.mypy]
files = "src"
ignore_missing_imports = true

[tool.pyrefly]
project-includes = ["src"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
ignore = [
  "CPY",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "missing-trailing-period",
  "missing-terminal-punctuation",
  "line-too-long",
  "magic-value-comparison",
  "suspicious-non-cryptographic-random-usage",
]
preview = true
select = ["ALL"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.3,<0.14.0"]
